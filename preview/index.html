<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Crazy Runner in City — Web Preview</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;font-family:Inter,system-ui,sans-serif;color:#fff;touch-action:none}
#game{position:fixed;inset:0}canvas{display:block}
.hud{position:fixed;inset:0;pointer-events:none;padding:18px}
.top{display:flex;justify-content:space-between;gap:10px}.pill{background:rgba(7,15,28,.72);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(12px);border-radius:16px;padding:10px 14px;font-weight:800;box-shadow:0 10px 30px #0004}.gold{color:#ffd84d}
#hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;background:#07111fe8;border:1px solid #ffffff22;border-radius:24px;padding:24px 28px;max-width:330px;pointer-events:auto}.hidden{display:none!important}
button{border:0;border-radius:14px;padding:12px 18px;font-weight:900;background:#ffd84d;color:#16120a}
.controls{position:fixed;left:18px;right:18px;bottom:20px;display:flex;justify-content:space-between;pointer-events:none}.ctrl{pointer-events:auto;width:70px;height:70px;border-radius:22px;background:#ffffff18;border:1px solid #fff3;color:#fff;font-size:28px;backdrop-filter:blur(10px)}
#jump{width:90px}.tag{font-size:12px;opacity:.65;margin-top:5px}
</style>
</head>
<body>
<div id="game"></div>
<div class="hud">
 <div class="top">
  <div class="pill">💎 <span id="coins" class="gold">0</span><div class="tag">DIAMONDS</div></div>
  <div class="pill">🏃 <span id="dist">0</span> m<div class="tag">DISTANCE</div></div>
  <div class="pill">⚡ <span id="speed">14</span><div class="tag">SPEED</div></div>
 </div>
 <div id="hint"><h2 style="margin:0 0 8px">CRAZY RUNNER</h2><div>Swipe / ← → to steer<br>Swipe up / Space to jump</div><br><button id="start">START RUN</button></div>
</div>
<div class="controls">
 <button class="ctrl" id="left">‹</button><button class="ctrl" id="jump">JUMP</button><button class="ctrl" id="right">›</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x07111f);
scene.fog=new THREE.Fog(0x07111f,35,150);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,300);
camera.position.set(0,5.5,9);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.getElementById('game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xbfe7ff,0x142033,2.0));
const sun=new THREE.DirectionalLight(0xffffff,2.4);sun.position.set(-10,25,12);sun.castShadow=true;scene.add(sun);

const mats={
 road:new THREE.MeshStandardMaterial({color:0x26364b,roughness:.9}),
 edge:new THREE.MeshStandardMaterial({color:0x48a6d9,roughness:.7}),
 building:new THREE.MeshStandardMaterial({color:0x31455d,roughness:.85}),
 window:new THREE.MeshStandardMaterial({color:0x9fe8ff,emissive:0x16445c,emissiveIntensity:1.4}),
 runner:new THREE.MeshStandardMaterial({color:0xff5b45,roughness:.7}),
 dark:new THREE.MeshStandardMaterial({color:0x101927,roughness:.9}),
 diamond:new THREE.MeshStandardMaterial({color:0x57e7ff,emissive:0x1b9bb7,emissiveIntensity:2,metalness:.2}),
 ramp:new THREE.MeshStandardMaterial({color:0xffc94d,roughness:.7}),
 danger:new THREE.MeshStandardMaterial({color:0xef3340,roughness:.75})
};
const group=new THREE.Group();scene.add(group);

function box(w,h,d,mat,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;group.add(m);return m}
function cityBlock(x,z,w,h,d){
 box(w,h,d,mats.building,x,h/2-1.5,z);
 for(let y=1;y<h-1;y+=2.4){
  for(let xx=-w/2+1;xx<w/2;xx+=2.2) box(.8,.18,.08,mats.window,x+xx,y,z-d/2-.05);
 }
}
for(let i=0;i<28;i++){
 const z=-i*7; cityBlock(-12-i%2*2,z,5+Math.random()*3,5+Math.random()*15,6);
 cityBlock(12+i%2*2,z,5+Math.random()*3,6+Math.random()*13,6);
}
for(let i=0;i<70;i++) box(28,.8,7,mats.road,0,-.9,-i*7);
for(let i=0;i<80;i++) { box(.25,.08,3,mats.edge,-4,-.45,-i*7+2); box(.25,.08,3,mats.edge,4,-.45,-i*7+2); }

const player=new THREE.Group();scene.add(player);
const body=box(.9,1.35,.8,mats.runner,0,0,0); body.parent=player; body.position.set(0,.9,0);
const head=new THREE.Mesh(new THREE.SphereGeometry(.43,16,12),mats.runner);head.position.set(0,1.75,0);head.castShadow=true;player.add(head);
for(const s of [-1,1]){const leg=box(.24,.75,.3,mats.dark,s*.23,.35,0);leg.parent=player;leg.position.set(s*.23,.35,0)}
player.position.set(0,0,-2);

const hazards=[], diamonds=[], ramps=[];
function diamond(x,z){const d=new THREE.Mesh(new THREE.OctahedronGeometry(.42),mats.diamond);d.position.set(x,.8,z);d.castShadow=true;group.add(d);diamonds.push(d)}
function hazard(x,z){const h=box(1.15,1.25,1.1,mats.danger,x,.2,z);hazards.push(h)}
function ramp(x,z){const r=new THREE.Mesh(new THREE.BoxGeometry(3,.35,4),mats.ramp);r.rotation.x=-.22;r.position.set(x,-.25,z);r.castShadow=true;group.add(r);ramps.push(r)}
for(let i=0;i<24;i++){const z=-18-i*14;diamond([-2.5,0,2.5][i%3],z); if(i%3===1)hazard([0,2.5,-2.5][i%3],z-5); if(i%6===0)ramp(0,z-7)}

let running=false, x=0, vy=0, score=0, coins=0, speed=14, last=performance.now(), jump=false;
const $=id=>document.getElementById(id);
function move(dx){if(!running)return;x=Math.max(-3,Math.min(3,x+dx));}
function doJump(){if(!running)return;if(player.position.y<=.01){vy=9;jump=true;}}
$('start').onclick=()=>{running=true;$('hint').classList.add('hidden');last=performance.now();beep(440,.08)};
$('left').onpointerdown=()=>move(-1);$('right').onpointerdown=()=>move(1);$('jump').onpointerdown=doJump;
addEventListener('keydown',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')move(-1);if(e.code==='ArrowRight'||e.code==='KeyD')move(1);if(e.code==='Space'||e.code==='ArrowUp')doJump();if(e.code==='Enter'&&!running)$('start').click()});
let sy=0;addEventListener('touchstart',e=>{sy=e.touches[0].clientY},{passive:true});addEventListener('touchend',e=>{const dy=e.changedTouches[0].clientY-sy;if(Math.abs(dy)>45&&dy<0)doJump()},{passive:true});

const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(freq,dur){if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;o.type='square';g.gain.value=.035;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+dur);o.stop(audio.currentTime+dur)}
function gameOver(){running=false;$('hint').classList.remove('hidden');$('hint').innerHTML='<h2 style="margin:0 0 8px">RUN OVER</h2><div>Distance: '+Math.floor(score)+'m<br>Diamonds: '+coins+'</div><br><button onclick="location.reload()">RUN AGAIN</button>';beep(120,.2)}

function tick(now){
 requestAnimationFrame(tick); const dt=Math.min((now-last)/1000,.035);last=now;
 if(running){
  score+=speed*dt; $('dist').textContent=Math.floor(score); $('coins').textContent=coins;
  player.position.x+=(x-player.position.x)*Math.min(1,dt*10);
  vy-=22*dt;player.position.y=Math.max(0,player.position.y+vy*dt);if(player.position.y===0)jump=false;
  for(const d of diamonds){d.position.z+=speed*dt;d.rotation.y+=dt*5;if(d.position.z>6)d.position.z-=330;
   if(d.position.distanceTo(player.position)<1.35){coins++;d.position.z-=70;beep(880,.06)}
  }
  for(const h of hazards){h.position.z+=speed*dt;if(h.position.z>8)h.position.z-=330;
   if(Math.abs(h.position.x-player.position.x)<1.05&&Math.abs(h.position.z-player.position.z)<1.0&&player.position.y<1.15)gameOver();
  }
  for(const r of ramps){r.position.z+=speed*dt;if(r.position.z>8)r.position.z-=330}
  speed=Math.min(23,14+score/180);
  $('speed').textContent=speed.toFixed(1);
 }
 camera.position.x+=(player.position.x*.48-camera.position.x)*.08;
 camera.position.y+=(5.4+player.position.y*.18-camera.position.y)*.08;
 camera.lookAt(player.position.x*.2,1,-9);
 renderer.render(scene,camera);
}
tick(performance.now());
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
